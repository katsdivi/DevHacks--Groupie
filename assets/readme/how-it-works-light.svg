  <rect x="615" y="84" width="250" height="196" rx="18" fill="none" stroke="#A6E35A" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;0.35;0.35;0" keyTimes="0;0.2480;0.2700;0.3400;0.97;1" dur="10.5s" begin="1.2s" repeatCount="indefinite"/></rect>
  <circle cx="649" cy="120" r="16" fill="#A6E35A"/>
  <text x="649" y="126" text-anchor="middle" font-size="16" font-weight="800" fill="#1E1E1E">3</text>
