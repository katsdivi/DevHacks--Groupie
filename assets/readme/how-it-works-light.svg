  <text x="635" y="176" font-size="19" font-weight="750" letter-spacing="-0.3" fill="#17213A">Fair split card</text>
  <text x="635" y="206" font-size="13.5" fill="#55607A">Code, not the LLM, balances</text><text x="635" y="227" font-size="13.5" fill="#55607A">the points. Swap any time,</text><text x="635" y="248" font-size="13.5" fill="#55607A">then vote Looks fair.</text>
</g>
