  <text x="355" y="452" font-size="13.5" fill="#55607A">Monday check-ins, a progress</text><text x="355" y="473" font-size="13.5" fill="#55607A">card, and DM reminders</text><text x="355" y="494" font-size="13.5" fill="#55607A">48, 24 and 3 hours out.</text>
</g>
