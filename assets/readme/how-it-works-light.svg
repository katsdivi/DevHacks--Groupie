  <text x="56" y="388" font-size="26" font-weight="800" letter-spacing="-0.6" fill="#17213A">One assignment in,</text>
  <text x="56" y="420" font-size="26" font-weight="800" letter-spacing="-0.6" fill="#3A6FD8">one meeting out.</text>
  <text x="56" y="458" font-size="14" fill="#55607A">Everything happens in your</text>
  <text x="56" y="479" font-size="14" fill="#55607A">Telegram group and the</text>
  <text x="56" y="500" font-size="14" fill="#55607A">Groupie Mini App.</text>
</g>
