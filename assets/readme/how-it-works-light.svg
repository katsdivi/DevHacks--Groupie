  <text x="75" y="176" font-size="19" font-weight="750" letter-spacing="-0.3" fill="#17213A">Drop the assignment</text>
  <text x="75" y="206" font-size="13.5" fill="#55607A">PDF, Word, slides and more,</text><text x="75" y="227" font-size="13.5" fill="#55607A">or pull it from Canvas</text><text x="75" y="248" font-size="13.5" fill="#55607A">through Cubbie with /canvas.</text>
</g>
