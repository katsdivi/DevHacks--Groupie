  <text x="355" y="176" font-size="19" font-weight="750" letter-spacing="-0.3" fill="#17213A">Tasks with points</text>
  <text x="355" y="206" font-size="13.5" fill="#55607A">The LLM reads it into 6 to 14</text><text x="355" y="227" font-size="13.5" fill="#55607A">tasks with effort points</text><text x="355" y="248" font-size="13.5" fill="#55607A">and skill tags.</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.39s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.6s" begin="0.39s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
