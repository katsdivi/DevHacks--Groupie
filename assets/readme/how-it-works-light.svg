  <text x="915" y="452" font-size="13.5" fill="#55607A">The 3 best one hour slots,</text><text x="915" y="473" font-size="13.5" fill="#55607A">then how to meet: Meet,</text><text x="915" y="494" font-size="13.5" fill="#55607A">Zoom or in person.</text>
</g>
