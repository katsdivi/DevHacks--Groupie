  <text x="635" y="452" font-size="13.5" fill="#55607A">Meeting card, .ics file and</text><text x="635" y="473" font-size="13.5" fill="#55607A">DMs, plus a Google Calendar</text><text x="635" y="494" font-size="13.5" fill="#55607A">invite when keys are set.</text>
</g>
