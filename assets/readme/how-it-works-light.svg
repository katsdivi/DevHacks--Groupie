  <text x="915" y="176" font-size="19" font-weight="750" letter-spacing="-0.3" fill="#17213A">Availability</text>
  <text x="915" y="206" font-size="13.5" fill="#55607A">Paint a 7 day grid, or let</text><text x="915" y="227" font-size="13.5" fill="#55607A">your calendar prefill it.</text><text x="915" y="248" font-size="13.5" fill="#55607A">Busy times only, never titles.</text>
</g>
